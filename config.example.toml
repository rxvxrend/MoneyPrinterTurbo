[app]
video_source = "pexels" # "pexels" или "pixabay"

# Скрывать ли панель конфигурации
hide_config = false

# Тайм-аут одного потокового запроса Azure TTS V1 (edge_tts), в секундах.
# При сетевых сбоях, ограничениях сервера или несоответствии голоса языку текста edge_tts может зависнуть надолго.
# Значение по умолчанию 30 секунд не дает WebUI-задаче оставаться без обратной связи; для медленной сети или прокси можно увеличить.
# 0 отключает тайм-аут.
edge_tts_timeout = 30

# Проверять ли TLS-сертификаты внешних API и загрузок материалов.
# По умолчанию проверка обязательна, чтобы защитить ключи Pexels/Pixabay и скачиваемые материалы от MITM-подмены.
# Временно ставьте false только если это действительно нужно для корпоративного прокси или самоподписанного сертификата.
tls_verify = true

# API Key Pexels
# Зарегистрируйтесь на https://www.pexels.com/api/, чтобы получить API key.
# Можно указать несколько ключей, чтобы обходить ограничения частоты запросов.
# Пример: pexels_api_keys = ["123adsf4567adf89","abd1321cd13efgfdfhi"]
# Важно соблюдать формат: ключи берутся в двойные кавычки, несколько ключей разделяются запятыми.
pexels_api_keys = []

# API Key Pixabay
# Зарегистрируйтесь на https://pixabay.com/api/docs/, чтобы получить API key.
# Можно указать несколько ключей, чтобы обходить ограничения частоты запросов.
# Пример: pixabay_api_keys = ["123adsf4567adf89","abd1321cd13efgfdfhi"]
# Важно соблюдать формат: ключи берутся в двойные кавычки, несколько ключей разделяются запятыми.
pixabay_api_keys = []

# Поддерживаемые провайдеры:
#   openai
#   aihubmix   (OpenAI-совместимый шлюз AI-моделей)
#   moonshot    (Moonshot / Kimi)
#   azure
#   qwen        (Tongyi Qianwen)
#   deepseek
#   gemini
#   ollama
#   g4f        (по умолчанию отключен; ставьте enable_g4f=true только после принятия рисков)
#   oneapi
#   cloudflare
#   minimax
#   mimo       (Xiaomi MiMo)
#   ernie       (Baidu ERNIE)
#   modelscope  (ModelScope)
#   litellm     (100+ провайдеров через шлюз LiteLLM)
llm_provider = "openai"

########## Настройки Pollinations AI
# Подробнее: https://pollinations.ai/
# API Key необязателен — оставьте пустым для публичного доступа.
pollinations_api_key = ""
# Базовый URL Pollinations API по умолчанию
pollinations_base_url = "https://pollinations.ai/api/v1"
# Модель генерации текста по умолчанию
pollinations_model_name = "openai-fast"

########## Настройки Ollama
# Не задавайте, если не используете собственный прокси.
ollama_base_url = ""
# Доступные модели см. на https://ollama.com/library
ollama_model_name = ""

########## OpenAI API Key
# Получите API key на https://platform.openai.com/api-keys
# Также можно указать ключ провайдера, совместимого с протоколом OpenAI Chat Completions,
# например OpenRouter или другой сервис с собственным base_url.
openai_api_key = ""
# Не задавайте, если не используете собственный прокси.
# Для OpenAI-совместимой платформы укажите здесь соответствующий base_url.
openai_base_url = ""
# Доступные модели см. на https://platform.openai.com/account/limits
# Для совместимого провайдера укажите model ID, который требует эта платформа.
openai_model_name = "gpt-4o-mini"

########## AIHubMix API Key
# AIHubMix совместим с OpenAI и позволяет одним API key обращаться к нескольким моделям.
# Зарегистрируйтесь и получите API key: https://aihubmix.com/?aff=CEve
aihubmix_api_key = ""
aihubmix_base_url = "https://aihubmix.com/v1"
aihubmix_model_name = "gpt-5.4-mini"

########## Moonshot API Key
# Получите API key на https://platform.moonshot.cn/console/api-keys
moonshot_api_key = ""
moonshot_base_url = "https://api.moonshot.cn/v1"
moonshot_model_name = "moonshot-v1-8k"

########## OneAPI API Key
# Подробнее: https://github.com/songquanpeng/one-api
oneapi_api_key = ""
oneapi_base_url = ""
oneapi_model_name = ""

########## G4F
# g4f использует обратно спроектированные сторонние endpoints и не рекомендуется для production.
# Предпочитайте официальные API, OpenAI-совместимых провайдеров, LiteLLM, Ollama или локальный inference.
# Если он все же нужен, установите необязательную зависимость:
#   uv sync --extra g4f
enable_g4f = false
# Подробнее: https://github.com/xtekky/gpt4free
# Список поддерживаемых моделей: https://github.com/xtekky/gpt4free/blob/main/g4f/models.py
g4f_model_name = "gpt-3.5-turbo"

########## Azure API Key
# Подробнее: https://learn.microsoft.com/zh-cn/azure/ai-services/openai/
# Документация API: https://learn.microsoft.com/zh-cn/azure/ai-services/openai/reference
azure_api_key = ""
azure_base_url = ""
azure_model_name = "gpt-35-turbo"        # замените на имя deployment вашей модели
azure_api_version = "2024-02-15-preview"

########## Gemini API Key
gemini_api_key = ""
gemini_model_name = "gemini-2.5-flash"

########## Grok API Key
grok_api_key = ""
grok_model_name = "grok-4.3"
grok_base_url = "https://api.x.ai/v1"

########## Groq API Key
# Получите API key на https://console.groq.com/keys
# Документация API: https://console.groq.com/docs/api-reference
# Доступные модели: https://console.groq.com/docs/api-reference#models-list
groq_api_key = ""
groq_model_name = "llama-3.3-70b-versatile"
groq_base_url = "https://api.groq.com/openai/v1"

########## Qwen API Key
# Получите API key на https://dashscope.console.aliyun.com/apiKey
# Подробности:
# https://tongyi.aliyun.com/qianwen/
# https://help.aliyun.com/zh/dashscope/developer-reference/model-introduction
qwen_api_key = ""
qwen_model_name = "qwen-max"


########## MiniMax API Key
# Получите API key на https://platform.minimax.io или https://platform.minimaxi.com
# MiniMax API совместим с OpenAI.
# Доступные модели: MiniMax-M3 (по умолчанию), MiniMax-M2.7, MiniMax-M2.7-highspeed
# Если API key возвращает 401 на api.minimax.io, попробуйте китайский endpoint: https://api.minimaxi.com/v1
minimax_api_key = ""
minimax_base_url = "https://api.minimax.io/v1"
minimax_model_name = "MiniMax-M3"

########## Xiaomi MiMo API Key
# Xiaomi MiMo API совместим с OpenAI.
# Подробнее: https://platform.xiaomimimo.com/docs/zh-CN/quick-start/first-api-call
mimo_api_key = ""
mimo_base_url = "https://api.xiaomimimo.com/v1"
mimo_model_name = "mimo-v2.5-pro"
# Xiaomi MiMo TTS использует тот же API key и base_url, что и MiMo LLM.
mimo_tts_model_name = "mimo-v2.5-tts"
# Необязательный prompt на естественном языке для стиля MiMo TTS.
mimo_tts_style_prompt = "Прочитайте естественно, ясно и в интонации, подходящей для озвучки короткого видео."

########## DeepSeek API Key
# Получите API key на https://platform.deepseek.com/api_keys
deepseek_api_key = ""
deepseek_base_url = "https://api.deepseek.com"
deepseek_model_name = "deepseek-chat"


########## ModelScope API Key
# Получите API key: https://modelscope.cn/docs/model-service/API-Inference/intro
# Обратите внимание: перед использованием API нужно привязать аккаунт Alibaba Cloud.
modelscope_api_key = ""
modelscope_base_url = "https://api-inference.modelscope.cn/v1/"
modelscope_model_name = "Qwen/Qwen3-32B"

########## LiteLLM (AI Gateway — 100+ провайдеров)
# LiteLLM маршрутизирует запросы к любому LLM-провайдеру через единый интерфейс.
# Используйте его для провайдеров, не поддержанных напрямую выше: Anthropic (native API),
# AWS Bedrock, Google Vertex AI, Cohere, Mistral, Together AI и т. д.
# Полный список: https://docs.litellm.ai/docs/providers
#
# LiteLLM автоматически читает API keys провайдеров из переменных окружения:
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, AWS_ACCESS_KEY_ID и т. д.
# Перед запуском задайте переменную окружения для выбранного провайдера.
#
# Имя модели в формате LiteLLM: "provider/model-name"
# Примеры: "openai/gpt-4o", "anthropic/claude-sonnet-4-20250514",
#          "bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0",
#          "gemini/gemini-2.5-flash", "ollama/llama3"
litellm_model_name = "openai/gpt-4o-mini"

# Провайдер субтитров: "edge" или "whisper".
# Если оставить пустым, субтитры генерироваться не будут.
subtitle_provider = "edge"

#
# ImageMagick
#
# После установки ImageMagick определяется автоматически, кроме Windows.
# В Windows пример пути: "C:\Program Files (x86)\ImageMagick-7.1.1-Q16-HDRI\magick.exe"
# Скачать: https://imagemagick.org/archive/binaries/ImageMagick-7.1.1-29-Q16-x64-static.exe

# imagemagick_path = "C:\\Program Files (x86)\\ImageMagick-7.1.1-Q16\\magick.exe"


#
# FFMPEG
#
# Обычно ffmpeg скачивается и определяется автоматически.
# Если окружение мешает автоматической загрузке, может появиться ошибка:
#   RuntimeError: No ffmpeg exe could be found.
#   Install ffmpeg on your system, or set the IMAGEIO_FFMPEG_EXE environment variable.
# В таком случае скачайте ffmpeg вручную и задайте ffmpeg_path: https://www.gyan.dev/ffmpeg/builds/

# ffmpeg_path = "C:\\Users\\harry\\Downloads\\ffmpeg.exe"

# Видеокодер. libx264 — самый стабильный вариант по умолчанию; опытные пользователи могут попробовать аппаратные кодеры для ускорения.
# Если текущий FFmpeg или драйвер оборудования не поддерживает выбранный кодер, приложение автоматически вернется к libx264.
# Доступные значения: "libx264", "h264_nvenc", "h264_amf", "h264_qsv", "h264_mf", "h264_videotoolbox"
# video_codec = "libx264"
#########################################################################################

# После успешной генерации видео API-сервис отдает endpoint для скачивания; по умолчанию используется текущий адрес сервиса и порт прослушивания.
# Например: http://127.0.0.1:8080/tasks/6357f542-a4e1-46a1-b4c9-bf3bd0df5285/final-1.mp4
# Если нужно отдавать сервис наружу через домен (обычно через nginx-прокси), укажите свой домен.
# Например: https://xxxx.com/tasks/6357f542-a4e1-46a1-b4c9-bf3bd0df5285/final-1.mp4
# endpoint="https://xxxx.com"
endpoint = ""


# Место хранения видеоматериалов
# material_directory = ""                    # видеоматериалы скачиваются в папку по умолчанию: ./storage/cache_videos в текущем проекте
# material_directory = "/user/harry/videos"  # видеоматериалы скачиваются в указанную папку
# material_directory = "task"                # видеоматериалы скачиваются в папку текущей задачи; уже скачанные материалы не будут общими между задачами
material_directory = ""

# Используется для управления состоянием задач
enable_redis = false
redis_host = "localhost"
redis_port = 6379
redis_db = 0
redis_password = ""

# Максимальное число параллельных задач генерации видео
max_concurrent_tasks = 5

# Максимальная длина очереди после заполнения параллельных слотов; при превышении API возвращает 429, чтобы анонимные запросы не копились бесконечно.
max_queued_tasks = 100


[whisper]
# Действует только при subtitle_provider = "whisper".

# Запуск на GPU с FP16
# model = WhisperModel(model_size, device="cuda", compute_type="float16")

# Запуск на GPU с INT8
# model = WhisperModel(model_size, device="cuda", compute_type="int8_float16")

# Запуск на CPU с INT8
# model = WhisperModel(model_size, device="cpu", compute_type="int8")

# рекомендуемый model_size: "large-v3"
model_size = "large-v3"
# если хотите использовать GPU, задайте device="cuda"
device = "CPU"
compute_type = "int8"


[proxy]
### Использовать прокси для доступа к Pexels API
### Формат: "http://<username>:<password>@<proxy>:<port>"
### Пример: "http://user:pass@proxy:1234"
### Документация: https://requests.readthedocs.io/en/latest/user/advanced/#proxies

# http = "http://10.10.1.10:3128"
# https = "http://10.10.1.10:1080"

[azure]
# Azure Speech API Key
# Получите API key: https://portal.azure.com/#view/Microsoft_Azure_ProjectOxford/CognitiveServicesHub/~/SpeechServices
speech_key = ""
speech_region = ""

[siliconflow]
# SiliconFlow API Key
# Получите API key: https://siliconflow.cn
api_key = ""

[ui]
# Настройки UI
# Скрывать ли журнал в UI
hide_log = false

# Настройки положения субтитров
# Доступные значения: "top", "center", "bottom", "custom"
# subtitle_position = "custom"
# Пользовательская позиция: процент от верхнего края (0-100), действует только при subtitle_position = "custom"
# custom_position = 70.0

########## Upload-Post (кросспостинг в TikTok/Instagram)
# Upload-Post позволяет автоматически публиковать сгенерированные видео в TikTok и Instagram.
# Создайте аккаунт и получите API key: https://upload-post.com
# Документация API: https://docs.upload-post.com

# Включить или отключить интеграцию Upload-Post
upload_post_enabled = false

# Ваш Upload-Post API key
upload_post_api_key = ""

# Ваше имя пользователя Upload-Post
upload_post_username = ""

# Платформы для кросспостинга (варианты: "tiktok", "instagram")
upload_post_platforms = ["tiktok", "instagram"]

# Автоматически публиковать видео после генерации (если false, API нужно вызывать вручную)
upload_post_auto_upload = false
