# Файл переопределения для GPU
# Использование: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Предварительные требования:
#   1. На хосте установлен драйвер NVIDIA GPU
#   2. Установлен NVIDIA Container Toolkit
#   3. Проверка: docker info | grep nvidia
#
# Этот файл переопределяет docker-compose.yml по умолчанию:
#   - сборка через Dockerfile.gpu (базовый образ NVIDIA CUDA)
#   - подключение GPU-устройства к сервису api
services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile.gpu
  api:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
